name: daro
description: A lightweight desktop database management UI built with Flutter
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  base_ui_flutter:
    path: base-ui-flutter
  chinese_font_library: ^1.3.0
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  flutter_svg: ^2.0.10
  mysql_client: ^0.0.27
  postgres: ^3.5.12
  dart_odbc: ^6.2.1
  sqlite3: ^2.7.6
  path_provider: ^2.1.6
  provider: ^6.1.2
  # SQL 编辑器:语法高亮(re_highlight)+行号+补全框架(CodeAutocomplete),自绘实现零动画
  re_editor: ^0.10.0
  # re_editor 传递依赖,查询页直接引用其 langSql 语法规则,显式声明
  re_highlight: ^0.0.3
  window_manager: ^0.5.2
  # 锁定 0.5.42：0.6.0+ 是 EOL 占位包，不再捆绑 sqlite3.dll，勿升级
  sqlite3_flutter_libs: 0.5.42
  # Navicat 连接导入:解密导出文件里保存的连接密码(AES-128-CBC + PKCS#7)
  pointycastle: ^4.0.0
  # Navicat 连接导入:解析 .ncx(此前仅作为 flutter_svg 的传递依赖,现显式声明)
  xml: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # 应用自绘图标集(矢量 SVG)
    - assets/icons/ui/
    - assets/icons/engines/
    - windows/runner/resources/
